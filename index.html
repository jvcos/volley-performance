<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a25"><title>Volley Performance</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#ecf3f6;background:#0d141d;--panel:#17232f;--panel2:#1c2d3b;--line:#2b3e4b;--muted:#a2b3c1;--accent:#8ee4c1;--gold:#f8ce78}*{box-sizing:border-box}body{margin:0;padding-bottom:88px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.shell{max-width:780px;margin:auto;padding:20px 16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:12px;letter-spacing:.17em;text-transform:uppercase;color:var(--accent);font-weight:800}.subtitle{color:var(--muted);font-size:13px;margin-top:6px}.headline{font-size:27px;font-weight:800;letter-spacing:-.04em;margin:8px 0 4px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:17px;margin:14px 0}.hero{background:linear-gradient(125deg,#214a4c,#172c3a 75%)}.pill{display:inline-flex;align-items:center;border-radius:30px;padding:6px 10px;font-size:11px;background:#294d4a;color:#b8ffe0;font-weight:700}.muted{color:var(--muted)}.small{font-size:12px}.h2{font-size:19px;font-weight:750;margin:20px 0 10px}.btn{border:0;border-radius:12px;background:var(--accent);color:#102b28;font-weight:800;padding:12px 15px}.btn.alt{background:#2a3b48;color:#eef4f6}.btn.danger{background:#563137;color:#ffd9d9}.btn.ghost{background:transparent;border:1px solid var(--line);color:#dce8ee}.row{display:flex;gap:10px;align-items:center}.spread{justify-content:space-between}.wrap{flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:var(--panel2);padding:13px;border-radius:13px}.metric strong{display:block;font-size:24px}.metric span{font-size:11px;color:var(--muted)}.tabs{position:fixed;bottom:0;left:0;right:0;background:#111e29f5;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10;padding:7px 3px max(8px,env(safe-area-inset-bottom))}.tab{flex:1;max-width:150px;border:0;background:none;color:#a9bbc7;padding:7px 2px;font-size:10px;font-weight:650}.tab.active{color:var(--accent)}.tab .emoji{display:block;font-size:19px;margin-bottom:3px}.day{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 12px;text-align:left;color:#e6f0f5;min-width:0}.day.active{border-color:var(--accent);background:#1b393a}.day strong{display:block;font-size:12px}.day span{font-size:10px;color:var(--muted)}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.days .day{padding:9px 2px;text-align:center}.exercise{border-top:1px solid var(--line);padding:13px 0}.exercise:first-of-type{border-top:0}.exercise-title{font-weight:750}.exercise-desc{color:var(--muted);font-size:12px;line-height:1.5;margin:6px 0}.input{background:#0e1a24;color:white;border:1px solid #3c5360;border-radius:10px;padding:10px;min-width:0;width:100%}.input:focus{outline:2px solid var(--accent);outline-offset:1px}.setgrid{display:grid;grid-template-columns:32px 1fr 1fr 55px;gap:7px;align-items:center;margin:7px 0}.setgrid label{font-size:11px;color:var(--muted)}.check{width:20px;height:20px;accent-color:#8ee4c1}.cardlink{width:100%;background:var(--panel);color:inherit;border:1px solid var(--line);border-radius:14px;text-align:left;padding:14px;margin:6px 0}.chip{border:1px solid #35535a;color:#b8e6d7;background:#1d353a;border-radius:25px;padding:5px 10px;font-size:11px}.empty{padding:26px 10px;text-align:center;color:var(--muted)}.notice{background:#343329;color:#f8dfa2;padding:11px 13px;border-radius:12px;font-size:12px;line-height:1.5}.bars{display:flex;align-items:end;gap:9px;height:150px;border-bottom:1px solid var(--line);padding:10px 5px 0}.barcol{flex:1;text-align:center;min-width:0}.bar{background:linear-gradient(#9feccc,#368c83);border-radius:6px 6px 0 0;min-height:4px}.barcol span{display:block;font-size:9px;color:var(--muted);margin-top:5px}.hidden{display:none!important}.hint{font-size:11px;color:var(--muted);line-height:1.5}.listline{border-top:1px solid var(--line);padding:12px 0}.listline:first-child{border:0}input[type=date]{color-scheme:dark}details summary{cursor:pointer;color:#b6e5d9;font-size:12px;margin-top:7px}.footer{font-size:11px;color:var(--muted);text-align:center;margin:22px 0}#toast{position:fixed;bottom:83px;left:50%;transform:translateX(-50%);background:#31584c;color:white;padding:10px 15px;border-radius:11px;display:none;z-index:20;font-size:12px;max-width:90vw;text-align:center}@media(min-width:600px){.shell{padding:26px}.grid.three{grid-template-columns:repeat(3,1fr)}}
@media(max-width:480px){.shell{padding:14px 12px 110px}.headline{font-size:24px}.panel{padding:14px;border-radius:15px}.tabs{padding:8px 5px max(10px,env(safe-area-inset-bottom))}.tab{font-size:12px;min-height:53px}.tab .emoji{font-size:22px}.days{gap:4px}.days .day{padding:10px 1px}.days .day strong{font-size:12px}.setgrid{grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 44px;gap:5px}.setgrid .input{padding:11px 6px;font-size:16px}.input{font-size:16px}.btn{min-height:44px}.exercise-title{line-height:1.4}.row.spread{align-items:flex-start}.chip{flex-shrink:0}.metric{padding:11px}.metric strong{font-size:21px}}@media(max-width:350px){.shell{padding-left:9px;padding-right:9px}.day span{font-size:9px}.tab{font-size:11px}.chip{font-size:10px;padding:5px 6px}}
.video-link{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin:4px 0 7px;padding:9px 13px;border:1px solid #426a70;border-radius:11px;background:#1d353a;color:#c5f8e6;font-size:12px;font-weight:750;text-decoration:none;max-width:100%}.video-link:focus-visible{outline:2px solid var(--accent);outline-offset:3px}</style></head><body><main id="app" class="shell"></main><nav class="tabs" id="tabs"></nav><div id="toast" role="status"></div><script>
'use strict';
const KEY='volley_performance_v1';const week=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const ex=(id,name,sets,reps,rest,info)=>({id,name,sets,reps,rest,info});
const programs={
mon:{label:'Inferiores · força e impulsão',kind:'gym',items:[ex('leg','Leg press 45°',3,'8–10','120 s','Mantenha a lombar apoiada e desça apenas até onde controla. Nas primeiras 2 semanas, pode começar com 2 séries.'),ex('curl','Cadeira flexora',3,'10–12','90 s','Faça a flexão sem embalo e controle o retorno. Substitui o terra romeno.'),ex('bulg','Agachamento búlgaro',2,'8 por perna','90 s','Comece sem carga, estabilize o joelho e mantenha a mesma amplitude dos dois lados.'),ex('hip','Elevação pélvica',2,'10–12','90 s','Suba contraindo os glúteos, sem hiperestender a lombar.'),ex('calf','Panturrilha em pé ou leg press',3,'12–15','60 s','Suba e desça com amplitude confortável, sem impulsos bruscos.'),ex('add','Cadeira adutora',2,'12–15','60 s','Feche as pernas com controle e carga moderada. Opcional se estiver cansado.')]},
wed:{label:'Superiores A · ênfase em peito',kind:'gym',items:[ex('chest','Supino reto na máquina',3,'8–12','90–120 s','Desça de modo controlado e não force amplitude dolorosa.'),ex('incline','Supino inclinado com halteres',2,'10–12','90 s','Banco em inclinação moderada; cotovelos em posição confortável.'),ex('row','Remada baixa na polia',3,'10–12','90 s','Tronco estável; puxe sem dar tranco.'),ex('lateral','Elevação lateral',2,'12–15','60 s','Carga leve; eleve sem balançar o tronco.'),ex('triceps','Tríceps na corda',3,'10–12','60–90 s','Cotovelos próximos ao tronco.'),ex('external','Rotação externa com elástico/polia',2,'12–15 por braço','45–60 s','Cotovelo junto ao corpo, carga bem leve; não provoque dor.')]},
fri:{label:'Superiores B · ênfase em costas',kind:'gym',items:[ex('pulldown','Puxada frontal',3,'8–12','90 s','Puxe à frente do corpo, sem jogar o tronco para trás.'),ex('supportedrow','Remada com apoio para peito',3,'10–12','90 s','Controle a escápula e evite compensar com a lombar.'),ex('shoulder','Desenvolvimento de ombros na máquina',2,'8–12','90 s','Faça somente se a elevação dos braços for confortável e sem dor.'),ex('pec','Peck deck',2,'10–12','60–90 s','Evite amplitude excessiva para trás.'),ex('biceps','Rosca direta com halteres',3,'10–12','60–90 s','Não balance o tronco.'),ex('reverse','Crucifixo inverso',2,'12–15','60 s','Trabalhe deltoide posterior e escápulas sem compensações.'),ex('wall','Wall slide',2,'10','45 s','Deslize os braços pela parede sem arquear a lombar.')]},
monhome:{label:'Mobilidade e ativação',kind:'home',items:[ex('ankle','Mobilidade de tornozelo na parede',2,'8 por lado','20 s','Joelho à frente sem levantar o calcanhar.'),ex('bridge','Ponte de glúteos',1,'12','30 s','Contraia os glúteos sem arquear a lombar.'),ex('squat','Agachamento sem carga',1,'10','30 s','Amplitude confortável; sem fadiga.')]},
volley:{label:'Aquecimento para vôlei',kind:'home',items:[ex('vankle','Mobilidade de tornozelos',1,'10 por lado','—','Movimentos suaves.'),ex('vcalf','Panturrilha sem carga',1,'10','—','Eleve os calcanhares com controle.'),ex('vsquat','Agachamento leve',1,'10','—','Sem fadiga.'),ex('shufflewarm','Deslocamento lateral leve',2,'10 segundos','30 s','Aumente a velocidade progressivamente.'),ex('arms','Mobilidade de braços e ombros',1,'1–2 minutos','—','Aqueça gradualmente antes de saques e ataques.')]},
wedhome:{label:'Core e estabilidade',kind:'home',items:[ex('deadbug','Dead bug',2,'8 por lado','30 s','Mantenha o tronco estável enquanto alterna braço e perna opostos.'),ex('sideplank','Prancha lateral',2,'20–30 s por lado','30 s','Mantenha quadril alinhado.'),ex('balance','Equilíbrio em uma perna',2,'20 s por lado','30 s','Joelho levemente flexionado, com apoio próximo se necessário.'),ex('ankle2','Mobilidade de tornozelo',1,'10 por lado','—','Sem forçar amplitude.')]},
frihome:{label:'Agilidade e reação',kind:'home',items:[ex('shuffle','Deslocamento lateral entre cones',3,'10 segundos','40–60 s','Cones a cerca de 2 m. Acelere e freie com controle.'),ex('line','Passos rápidos sobre linha',3,'10 segundos','40–60 s','Alterne os pés sobre uma linha sem perder coordenação.'),ex('start','Saída explosiva curta',3,'2 por lado','40–60 s','Saia da posição defensiva por 2–3 passos e retorne caminhando.')]},
sathome:{label:'Saltos e explosão · opcional',kind:'home',items:[ex('cmj','Salto vertical com contramovimento',3,'3 saltos','60–120 s','Balance os braços, salte e aterrisse suavemente. Pare se perder qualidade.'),ex('approach','Salto de aproximação de ataque',2,'3 saltos','60–120 s','Coordene passos e braços. Comece submáximo.'),ex('snap','Snap-down · aterrissagem',2,'5','45–60 s','Dos braços elevados, desça à posição atlética e estabilize, sem salto.')]},
sunhome:{label:'Recuperação e mobilidade',kind:'home',items:[ex('easywalk','Caminhada confortável',1,'10–20 min','—','Opcional. Pode substituir por descanso completo.'),ex('easyankle','Mobilidade de tornozelo',1,'8 por lado','—','Movimentos leves.'),ex('easyhip','Mobilidade de quadril',1,'8 por lado','—','Movimento confortável, sem forçar.')]}
};
const schedule=[{d:'Dom',gym:null,home:'sunhome',tag:'Recuperação / jogo'},{d:'Seg',gym:'mon',home:'monhome',tag:'Pernas'},{d:'Ter',gym:null,home:'volley',tag:'Vôlei 1h30'},{d:'Qua',gym:'wed',home:'wedhome',tag:'Superiores A'},{d:'Qui',gym:null,home:'volley',tag:'Vôlei 1h30'},{d:'Sex',gym:'fri',home:'frihome',tag:'Superiores B'},{d:'Sáb',gym:null,home:'sathome',tag:'Jogo / saltos'}];
const videoQueries={leg:'leg press 45 execução correta',curl:'cadeira flexora execução correta',bulg:'agachamento búlgaro execução correta',hip:'elevação pélvica hip thrust execução correta',calf:'panturrilha em pé leg press execução correta',add:'cadeira adutora execução correta',chest:'supino reto máquina execução correta',incline:'supino inclinado halteres execução correta',row:'remada baixa polia execução correta',lateral:'elevação lateral halteres execução correta',triceps:'tríceps corda polia execução correta',external:'rotação externa ombro elástico manguito exercício',pulldown:'puxada frontal polia execução correta',supportedrow:'remada máquina apoio peitoral execução correta',shoulder:'desenvolvimento ombros máquina execução correta',pec:'peck deck voador execução correta',biceps:'rosca direta halteres execução correta',reverse:'crucifixo inverso execução correta',wall:'wall slides exercício ombro parede',ankle:'mobilidade tornozelo joelho parede exercício',bridge:'ponte glúteos no chão execução correta',squat:'agachamento livre sem carga execução correta',vankle:'mobilidade tornozelo para vôlei',vcalf:'elevação panturrilha peso corporal execução',vsquat:'agachamento sem peso execução correta',shufflewarm:'deslocamento lateral vôlei aquecimento',arms:'aquecimento mobilidade ombros vôlei',deadbug:'dead bug exercício abdominal execução correta',sideplank:'prancha lateral execução correta',balance:'equilíbrio uma perna exercício propriocepção',ankle2:'mobilidade tornozelo joelho parede exercício',shuffle:'deslocamento lateral cones agilidade voleibol',line:'quick feet line drill passos rápidos linha agilidade',start:'saída rápida posição defensiva vôlei deslocamento',cmj:'countermovement jump técnica salto vertical aterrissagem',approach:'aproximação ataque vôlei passos salto técnica',snap:'snap down landing drill aterrissagem pliometria',easywalk:'caminhada leve postura caminhada',easyankle:'mobilidade tornozelo exercícios',easyhip:'mobilidade quadril exercícios iniciante'};
function videoUrl(e){const q=videoQueries[e.id]||e.name+' execução correta';return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q+' tutorial demonstração')}
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function read(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&Array.isArray(x.sessions)&&Array.isArray(x.jumps)?x:{sessions:[],jumps:[]}}catch{return {sessions:[],jumps:[]}}}let db=read(),tab='inicio',day=new Date().getDay(),active=null,sessionDate=localDate();
function localDate(d=new Date()){const n=new Date(d.getTime()-d.getTimezoneOffset()*60000);return n.toISOString().slice(0,10)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{toast('Armazenamento indisponível. Exporte os dados para não perder registros.');return false}}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>x.style.display='none',2800)}
function nav(t){tab=t;active=null;render()};function chooseDay(d){day=d;render()};function chooseProgram(id){active=id;tab='treinos';render()};
function dateStr(s){const [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function renderTabs(){document.getElementById('tabs').innerHTML=[['inicio','⌂','Início'],['treinos','▣','Treinos'],['historico','◷','Histórico'],['ajustes','⚙','Ajustes']].map(x=>`<button class="tab ${tab===x[0]?'active':''}" onclick="nav('${x[0]}')"><span class="emoji">${x[1]}</span>${x[2]}</button>`).join('')}
function head(title,sub){return `<div class="top"><div><div class="brand">VOLLEY PERFORMANCE</div><div class="headline">${title}</div><div class="subtitle">${sub}</div></div><div style="font-size:29px">🏐</div></div>`}
function daySelector(){return `<div class="days" style="margin:17px 0">${schedule.map((x,i)=>`<button class="day ${day===i?'active':''}" onclick="chooseDay(${i})"><strong>${x.d}</strong><span>${i===0?'D':i===6?'S':i}</span></button>`).join('')}</div>`}
function cardProgram(id,subtitle=''){const p=programs[id];return `<button class="cardlink" onclick="chooseProgram('${id}')"><div class="row spread"><div><div class="exercise-title">${safe(p.label)}</div><div class="small muted" style="margin-top:4px">${p.items.length} exercícios${subtitle?' · '+safe(subtitle):''}</div></div><span style="color:var(--accent)">Abrir →</span></div></button>`}
function renderHome(){const x=schedule[day],today=day===new Date().getDay();const total=db.sessions.length;return head('Seu treino, sua evolução','Força • Impulsão • Agilidade')+`<section class="panel hero"><span class="pill">${today?'HOJE':'DIA SELECIONADO'} · ${x.d.toUpperCase()}</span><div class="headline" style="font-size:23px">${x.tag}</div><p class="small" style="color:#c5d8dc">Treine com qualidade. O objetivo é evoluir no vôlei sem acumular fadiga desnecessária.</p></section>`+daySelector()+`<div class="h2">Atividades do dia</div>${x.gym?cardProgram(x.gym,'Academia'):'<div class="panel small">'+(day===2||day===4?'🏐 Treino de vôlei de areia — 1h30. Registre como atividade ao finalizar.':'Dia sem academia fixa.')+((day===2||day===4)?`<div style="margin-top:12px"><button class="btn alt" onclick="saveVolley()">Registrar treino de vôlei</button></div>`:'')+'</div>'}${cardProgram(x.home,'Em casa')}${day===6?'<div class="notice">Se houver jogo, substitua os saltos pelo vôlei. Se estiver dolorido ou cansado, descanse.</div>':''}<div class="h2">Seu progresso</div><div class="grid three"><div class="metric"><strong>${total}</strong><span>Sessões registradas</span></div><div class="metric"><strong>${new Set(db.sessions.map(s=>s.program)).size}</strong><span>Tipos de treino feitos</span></div><div class="metric"><strong>${db.sessions.filter(s=>s.date>=localDate(new Date(Date.now()-6*86400000))).length}</strong><span>Sessões nos últimos 7 dias</span></div></div><div class="footer">Seu histórico fica salvo neste navegador. Faça backups em Ajustes.</div>`}
function renderTreinos(){if(!active){return head('Fichas de treino','Escolha uma sessão para visualizar e registrar')+`<div class="h2">Academia</div>${['mon','wed','fri'].map(x=>cardProgram(x)).join('')}<div class="h2">Em casa e quadra</div>${['monhome','volley','wedhome','frihome','sathome','sunhome'].map(x=>cardProgram(x)).join('')}`}const p=programs[active];return head('Registrar treino',p.label)+`<button class="btn ghost" style="margin:16px 0" onclick="active=null;render()">← Todas as fichas</button><div class="panel"><label class="small muted" for="sessiondate">Data da sessão</label><input id="sessiondate" type="date" class="input" style="margin-top:6px" value="${sessionDate}" onchange="sessionDate=this.value"><p class="hint">Carga em kg; anote a carga total indicada pela máquina. Para halteres, use uma convenção consistente (ex.: kg por halter). Marque as séries concluídas.</p>${p.items.map((e,i)=>`<div class="exercise"><div class="row spread"><div class="exercise-title">${i+1}. ${safe(e.name)}</div><span class="chip">${e.sets} × ${safe(e.reps)}</span></div><div class="exercise-desc">${safe(e.info)}<br>Descanso: ${safe(e.rest)}</div><a class="video-link" href="${videoUrl(e)}" target="_blank" rel="noopener noreferrer" aria-label="Pesquisar vídeo de demonstração para ${safe(e.name)} no YouTube">▶ Ver demonstração no YouTube ↗</a><details><summary>Ver instruções e registrar séries</summary><div class="setgrid" style="margin-top:10px"><label>Série</label><label>Carga (kg)</label><label>Reps / tempo</label><label>Feita</label></div>${Array.from({length:e.sets},(_,j)=>`<div class="setgrid"><span class="small muted">${j+1}</span><input class="input" type="number" min="0" step="0.5" inputmode="decimal" id="w-${i}-${j}" placeholder="—"><input class="input" type="text" id="r-${i}-${j}" placeholder="${safe(e.reps)}"><input class="check" type="checkbox" id="c-${i}-${j}" aria-label="Série ${j+1} concluída"></div>`).join('')}</details></div>`).join('')}<label class="small muted" for="notes">Observações (opcional)</label><textarea class="input" id="notes" rows="3" placeholder="Ex.: carga confortável, pernas pesadas, ombro bem..."></textarea><div style="margin-top:12px"><button class="btn" style="width:100%" onclick="saveSession('${active}')">Salvar treino realizado</button></div></div><div class="notice">Mantenha 2–3 repetições de reserva na musculação. Não faça saltos máximos com dor, fadiga excessiva ou perda de controle na aterrissagem.</div>`}
function saveSession(id){const date=document.getElementById('sessiondate').value;if(!date){toast('Escolha a data.');return}const p=programs[id],items=p.items.map((e,i)=>({id:e.id,name:e.name,sets:Array.from({length:e.sets},(_,j)=>({weight:document.getElementById(`w-${i}-${j}`).value,reps:document.getElementById(`r-${i}-${j}`).value,done:document.getElementById(`c-${i}-${j}`).checked}))}));if(!items.some(e=>e.sets.some(s=>s.done))&&!confirm('Nenhuma série foi marcada. Salvar a sessão mesmo assim?'))return;db.sessions.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),date,program:id,title:p.label,items,notes:document.getElementById('notes').value});if(persist()){toast('Treino salvo!');active=null;tab='historico';render()}}
function saveVolley(){db.sessions.push({id:Date.now().toString(36),date:localDate(),program:'volley-training',title:'Vôlei de areia · 1h30',items:[],notes:'Treino técnico na quadra'});persist();toast('Treino de vôlei registrado!');render()}
function sessionDetails(s){return `<details><summary>Ver séries e observações</summary>${s.items.map(e=>`<div class="listline"><strong class="small">${safe(e.name)}</strong><div class="small muted">${e.sets.filter(a=>a.done).map(a=>(a.weight?`${safe(a.weight)} kg · `:'')+(a.reps?safe(a.reps):'série feita')).join(' | ')||'Sem séries marcadas'}</div></div>`).join('')}${s.notes?`<p class="small">${safe(s.notes)}</p>`:''}</details>`}
function renderHistory(){const ss=[...db.sessions].sort((a,b)=>b.date.localeCompare(a.date));const loads={};for(const s of [...ss].reverse())for(const e of s.items)for(const a of e.sets)if(a.done&&a.weight!==''&&Number.isFinite(Number(a.weight)))loads[e.id]={name:e.name,weight:Number(a.weight),date:s.date};return head('Histórico','Cargas, séries e sessões anteriores')+`<div class="grid"><div class="metric"><strong>${ss.length}</strong><span>Sessões registradas</span></div><div class="metric"><strong>${Object.keys(loads).length}</strong><span>Exercícios com carga</span></div></div><div class="h2">Últimas cargas registradas</div><div class="panel">${Object.keys(loads).length?Object.values(loads).map(e=>`<div class="row spread listline"><span class="small">${safe(e.name)}</span><strong>${e.weight} kg</strong></div>`).join(''):'<div class="empty">Registre cargas nos treinos para vê-las aqui.</div>'}</div><div class="h2">Sessões anteriores</div>${ss.length?ss.map(s=>`<div class="panel"><div class="row spread"><strong>${safe(s.title)}</strong><span class="small muted">${dateStr(s.date)}</span></div>${sessionDetails(s)}<div style="text-align:right;margin-top:10px"><button class="btn ghost small" onclick="deleteSession('${s.id}')">Excluir</button></div></div>`).join(''):'<div class="panel empty">Ainda não há treinos registrados.</div>'}`}
function deleteSession(id){if(!confirm('Excluir esta sessão do histórico?'))return;db.sessions=db.sessions.filter(s=>s.id!==id);persist();render()}
function renderJumps(){const js=[...db.jumps].sort((a,b)=>a.date.localeCompare(b.date));const latest=js.at(-1),best=js.length?Math.max(...js.map(j=>j.cm)):null;const last=js.slice(-8);const mx=Math.max(10,...last.map(j=>j.cm));return head('Evolução da impulsão','Acompanhe seu salto vertical em centímetros')+`<div class="grid"><div class="metric"><strong>${latest?latest.cm+' cm':'—'}</strong><span>Última medição</span></div><div class="metric"><strong>${best!==null?best+' cm':'—'}</strong><span>Melhor marca</span></div></div><div class="panel"><div class="h2" style="margin-top:0">Registrar medição</div><p class="hint">Use sempre o mesmo método (ex.: salto vertical com contramovimento e alcance na parede). Faça 3 tentativas após aquecimento e registre a melhor, em condições semelhantes.</p><div class="grid"><div><label class="small muted">Data</label><input type="date" id="jumpdate" class="input" value="${localDate()}"></div><div><label class="small muted">Altura (cm)</label><input type="number" min="1" max="150" step="0.1" id="jumpcm" class="input" placeholder="Ex.: 42.5"></div></div><label class="small muted" style="display:block;margin-top:10px">Método</label><select class="input" id="jumpmethod"><option>Salto vertical parado (CMJ)</option><option>Salto com aproximação</option><option>Outro método</option></select><button class="btn" style="margin-top:12px;width:100%" onclick="saveJump()">Salvar medição</button></div><div class="h2">Últimas medições</div><div class="panel">${last.length?`<div class="bars">${last.map(j=>`<div class="barcol"><div class="small" style="margin-bottom:4px">${j.cm}</div><div class="bar" style="height:${Math.max(5,j.cm/mx*115)}px"></div><span>${j.date.slice(5)}</span></div>`).join('')}</div><p class="hint">Alturas em centímetros. Compare medições feitas com o mesmo método.</p>`:'<div class="empty">Registre sua primeira medição para acompanhar a evolução.</div>'}${js.slice().reverse().map(j=>`<div class="row spread listline"><span class="small">${dateStr(j.date)} · ${safe(j.method)}</span><span><strong>${j.cm} cm</strong> <button class="btn ghost small" style="padding:5px" onclick="deleteJump('${j.id}')">×</button></span></div>`).join('')}</div>`}
function saveJump(){const cm=Number(document.getElementById('jumpcm').value),date=document.getElementById('jumpdate').value,method=document.getElementById('jumpmethod').value;if(!date||!Number.isFinite(cm)||cm<=0||cm>150){toast('Informe uma altura válida (1–150 cm).');return}db.jumps.push({id:Date.now().toString(36),date,cm,method});persist();toast('Medição salva!');render()}
function deleteJump(id){if(!confirm('Excluir esta medição?'))return;db.jumps=db.jumps.filter(j=>j.id!==id);persist();render()}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),...db},null,2)],{type:'application/json'}));a.download='volley-performance-backup-'+localDate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
function importData(input){const file=input.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(!Array.isArray(obj.sessions)||!Array.isArray(obj.jumps))throw Error('Formato inválido');if(!confirm('Substituir os registros atuais pelos dados do arquivo?'))return;db={sessions:obj.sessions,jumps:obj.jumps};persist();toast('Backup importado!');render()}catch{toast('Arquivo inválido. Use um backup exportado pelo aplicativo.')}};reader.readAsText(file)}
function renderSettings(){return head('Ajustes e backups','Controle dos seus dados')+`<div class="panel"><div class="h2" style="margin-top:0">Seus dados</div><p class="small muted">Os registros ficam neste navegador, neste dispositivo. Para alterar as fichas, atualize o arquivo do site; seus registros existentes permanecem se a origem e o armazenamento do navegador forem mantidos. Abrir o arquivo em outro navegador não transfere o histórico automaticamente. O modo privado, a limpeza dos dados do navegador ou restrições de armazenamento podem apagar registros.</p><div class="row wrap"><button class="btn" onclick="exportData()">↓ Exportar backup</button><label class="btn alt" style="cursor:pointer">↑ Importar backup<input class="hidden" type="file" accept="application/json,.json" onchange="importData(this)"></label></div></div><div class="panel"><div class="h2" style="margin-top:0">Como usar</div><p class="small">1. Abra a ficha em Treinos e registre as séries concluídas.<br>2. Consulte as cargas anteriores em Histórico.<br>3. Exporte um backup regularmente para não perder seus registros.</p></div><div class="panel"><div class="h2" style="margin-top:0">Segurança do treino</div><p class="small muted">Treino de pernas segunda, superiores A quarta, superiores B sexta; vôlei terça e quinta. Sábado é condicional: se jogar ou estiver cansado, não faça saltos extras. Pare exercícios que provoquem dor, especialmente em joelhos, tendões, ombros ou lombar. Ajuste o plano com profissional presencial se necessário.</p></div><div class="panel"><button class="btn danger" onclick="clearAll()">Apagar todos os registros</button><p class="hint">Ação irreversível sem backup.</p></div>`}
function clearAll(){if(!confirm('Apagar permanentemente todos os registros deste navegador?'))return;db={sessions:[],jumps:[]};persist();toast('Registros apagados.');render()}
function render(){renderTabs();document.getElementById('app').innerHTML=tab==='inicio'?renderHome():tab==='treinos'?renderTreinos():tab==='historico'?renderHistory():renderSettings()}
render();
</script></body></html>
