k:'caminhada leve postura caminhada',easyankle:'mobilidade tornozelo exercícios',easyhip:'mobilidade quadril exercícios iniciante',seatedcalf:'panturrilha sentada execução correta soleo',vwarmwalk:'trote leve caminhada aquecimento vôlei areia',vjump:'salto vertical leve técnica voleibol',vapproach:'salto aproximação ataque voleibol',a_incline:"supino inclinado halteres execução correta",a_tbar:"remada cavalinho execução correta apoio",a_underrow:"remada baixa supinada execução correta",a_underpull:"puxador frontal pegada supinada execução correta",a_skull:"tríceps testa com barra execução correta",b_legext:"cadeira extensora unilateral execução",b_legcurl:"cadeira flexora unilateral execução",b_stiff:"stiff unilateral halteres técnica",b_sumo:"agachamento sumô execução",b_arnold:"desenvolvimento arnold execução",mob_stick:"mobilidade ombro bastão execução",mob_cat:"gato vaca mobilidade coluna execução",mob_superman:"superman exercício solo execução"};
const selectedVideos={"a_underrow":"https://www.youtube.com/shorts/N25n4jZbvIQ","a_incline":"https://www.youtube.com/shorts/Fa-X2ByLHaY","a_tbar":"https://www.youtube.com/shorts/pNcsDruTiS4","a_underpull":"https://www.youtube.com/shorts/dqAcAbFHK44","a_fly":"https://www.youtube.com/shorts/IRWaOuOsVxA","a_bench":"https://www.youtube.com/shorts/50RSzhMG5Hc","a_skull":"https://www.youtube.com/shorts/8LFsUN913r4","a_rope":"https://www.youtube.com/shorts/UdfF_LQ1iak","a_21":"https://www.youtube.com/shorts/KMmKHgjskJ8","b_legext":"https://www.youtube.com/shorts/TDmfcSH_Ub4","b_legcurl":"https://www.youtube.com/shorts/vl64tUJrFIQ","b_bulg":"https://www.youtube.com/shorts/MnPiYYdkcuU","b_stiff":"https://www.youtube.com/shorts/dVwxqF3NQKw","b_sumo":"https://www.youtube.com/shorts/JgXt1ThP55o","b_abductor":"https://www.youtube.com/shorts/MxO5joRVQUs","b_frontraise":"https://www.youtube.com/shorts/jzFo_Uex5Bg","b_arnold":"https://www.youtube.com/shorts/0Zp-1_LvLbE","b_calf":"https://www.youtube.com/shorts/erUNxqpFxkc"};
function videoUrl(e){if(selectedVideos[e.id])return selectedVideos[e.id];const q=videoQueries[e.id]||e.name+' execução correta';return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q+' shorts execução demonstração')}
function videoLabel(e){return selectedVideos[e.id]?'▶ Assistir Short selecionado ↗':'▶ Pesquisar Shorts deste exercício ↗'}
function loadOptions(){return '<option value="">—</option>'+Array.from({length:21},(_,k)=>'<option value="'+(k*5)+'">'+(k*5)+' kg</option>').join('')}
function repOptions(e){const s=e.reps;const nums=[...s.matchAll(/\d+/g)].map(x=>Number(x[0]));const range=s.includes('–')||s.includes('-');let values=[];if(!nums.length)return '<option value="">—</option><option value="'+safe(s)+'">'+safe(s)+'</option>';if(range&&nums.length>=2){const [lo,hi]=nums;for(let n=lo;n<=Math.min(hi,lo+30);n++)values.push(n)}else{for(let n=Math.max(1,nums[0]-2);n<=nums[0]+2;n++)values.push(n)}const finalNum=String(range&&nums.length>1?nums[1]:nums[0]);const suffix=s.slice(s.lastIndexOf(finalNum)+finalNum.length);return '<option value="">Selecionar</option>'+values.map(v=>{const x=String(v)+suffix;return '<option value="'+safe(x)+'" '+(v===nums[0]?'selected':'')+'>'+safe(x)+'</option>'}).join('')}

const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function read(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&Array.isArray(x.sessions)&&Array.isArray(x.jumps)?x:{sessions:[],jumps:[]}}catch{return {sessions:[],jumps:[]}}}let db=read(),tab='inicio',day=new Date().getDay(),active=null,sessionDate=localDate();
function localDate(d=new Date()){const n=new Date(d.getTime()-d.getTimezoneOffset()*60000);return n.toISOString().slice(0,10)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{toast('Armazenamento indisponível. Exporte os dados para não perder registros.');return false}}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>x.style.display='none',2800)}
function nav(t){tab=t;active=null;render()};function chooseDay(d){day=d;render()};function chooseProgram(id){active=id;tab='treinos';render()};
function dateStr(s){const [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function renderTabs(){document.getElementById('tabs').innerHTML=[['inicio','⌂','Início'],['treinos','▣','Treinos'],['historico','◷','Histórico'],['ajustes','⚙','Ajustes']].map(x=>`<button class="tab ${tab===x[0]?'active':''}" onclick="nav('${x[0]}')"><span class="emoji">${x[1]}</span>${x[2]}</button>`).join('')}
function head(title,sub){return `<div class="top"><div><div class="brand">ZEZINHO PERFORMANCE</div><div class="headline">${title}</div><div class="subtitle">${sub}</div></div><div style="font-size:29px">🏐</div></div>`}
function daySelector(){return `<div class="days" style="margin:17px 0">${schedule.map((x,i)=>`<button class="day ${day===i?'active':''}" onclick="chooseDay(${i})"><strong>${x.d}</strong><span>${i===0?'D':i===6?'S':i}</span></button>`).join('')}</div>`}
function cardProgram(id,subtitle=''){const p=programs[id];return `<button class="cardlink" onclick="chooseProgram('${id}')"><div class="row spread"><div><div class="exercise-title">${safe(p.label)}</div><div class="small muted" style="margin-top:4px">${p.items.length} exercícios${subtitle?' · '+safe(subtitle):''}</div></div><span style="color:var(--accent)">Abrir →</span></div></button>`}
function renderHome(){const x=schedule[day],today=day===new Date().getDay();const total=db.sessions.length;return head('Seu treino, sua evolução','Força • Impulsão • Agilidade')+`<section class="panel hero"><span class="pill">${today?'HOJE':'DIA SELECIONADO'} · ${x.d.toUpperCase()}</span><div class="headline" style="font-size:23px">${x.tag}</div><p class="small" style="color:#c5d8dc">Treine com qualidade, sem acumular fadiga desnecessária. Antes do vôlei, aqueça progressivamente. Se a panturrilha estiver pesada, reduza saltos e agilidade extras.</p></section>`+daySelector()+`<div class="h2">Atividades do dia</div>${x.gym?cardProgram(x.gym,'Academia'):'<div class="panel small">'+(day===2||day===4?'🏐 Treino de vôlei de areia — 1h30. Registre como atividade ao finalizar.':'Dia sem academia fixa.')+((day===2||day===4)?`<div style="margin-top:12px"><button class="btn alt" onclick="saveVolley()">Registrar treino de vôlei</button></div>`:'')+'</div>'}${cardProgram(x.home,'Em casa')}${day===6?'<div class="notice">Se houver jogo, substitua os saltos pelo vôlei. Se a panturrilha estiver pesada ou dolorida, não faça saltos extras.</div>':''}<div class="h2">Seu progresso</div><div class="grid three"><div class="metric"><strong>${total}</strong><span>Sessões registradas</span></div><div class="metric"><strong>${new Set(db.sessions.map(s=>s.program)).size}</strong><span>Tipos de treino feitos</span></div><div class="metric"><strong>${db.sessions.filter(s=>s.date>=localDate(new Date(Date.now()-6*86400000))).length}</strong><span>Sessões nos últimos 7 dias</span></div></div><div class="footer">Seu histórico fica salvo neste navegador. Faça backups em Ajustes.</div>`}
function renderTreinos(){if(!active){return head('Fichas de treino','Escolha uma sessão para visualizar e registrar')+`<div class="h2">Academia</div>${['mon','wed','fri'].map(x=>cardProgram(x, x==='mon'?'Segunda':x==='wed'?'Quarta':'Sexta')).join('')}<div class="h2">Em casa e quadra</div>${['monhome','volley','wedhome','frihome','sathome','sunhome'].map(x=>cardProgram(x)).join('')}`}const p=programs[active];return head('Registrar treino',p.label)+`<button class="btn ghost" style="margin:16px 0" onclick="active=null;render()">← Todas as fichas</button><div class="panel"><label class="small muted" for="sessiondate">Data da sessão</label><input id="sessiondate" type="date" class="input date-input" style="margin-top:6px" value="${sessionDate}" onchange="sessionDate=this.value">${p.kind==='gym'?'<div class="notice">Ficha recebida: volume muito elevado (A: 36 séries por sessão; B: 52 séries). Confirme a prescrição com o responsável antes de executar integralmente, especialmente junto ao vôlei terça e quinta. A Rosca 21 também precisa de confirmação da contagem.</div>':''}<p class="hint">Carga em kg; anote a carga total indicada pela máquina. Para halteres, use uma convenção consistente (ex.: kg por halter). Marque o exercício após concluir todas as séries. A mesma carga e repetição serão aplicadas às séries previstas.</p>${p.items.map((e,i)=>`<div class="exercise"><div class="row spread"><div class="exercise-title">${i+1}. ${safe(e.name)}</div><span class="chip">${e.sets} × ${safe(e.reps)}</span></div><div class="exercise-desc">${p.kind==='gym'&&gymTargets[e.id]?`<div class="muscle-target"><strong>Trabalha:</strong> ${safe(gymTargets[e.id][0])}<div><strong>Objetivo:</strong> ${safe(gymTargets[e.id][1])}</div></div>`:''}${safe(e.info)}<br>Descanso: ${safe(e.rest)}</div>${['volley','frihome','sathome','sunhome'].includes(active)?'':`<a class="video-link" href="${videoUrl(e)}" target="_blank" rel="noopener noreferrer" aria-label="Abrir demonstração de ${safe(e.name)} no YouTube">${videoLabel(e)}</a>`}<div class="exercise-entry"><div class="entry-fields"><div><label for="w-${i}">Carga (kg)</label><select class="input set-select" id="w-${i}">${loadOptions()}</select></div><div><label for="r-${i}">Reps / tempo</label><select class="input set-select" id="r-${i}">${repOptions(e)}</select></div></div><label class="exercise-done"><input class="check" type="checkbox" id="c-${i}" onchange="this.closest('.exercise').classList.toggle('is-done',this.checked)"><span>Concluí ${e.sets} ${e.sets===1?'série':'séries'}</span></label></div></div>`).join('')}<label class="small muted" for="notes">Observações (opcional)</label><textarea class="input" id="notes" rows="3" placeholder="Ex.: carga confortável, pernas pesadas, ombro bem..."></textarea><div style="margin-top:12px"><button class="btn" style="width:100%" onclick="saveSession('${active}')">Salvar treino realizado</button></div></div><div class="notice">Mantenha 2–3 repetições de reserva na musculação. Não faça saltos máximos com dor, fadiga excessiva ou perda de controle na aterrissagem.</div>`}
function saveSession(id){const date=document.getElementById('sessiondate').value;if(!date){toast('Escolha a data.');return}const p=programs[id],items=p.items.map((e,i)=>{const weight=document.getElementById('w-'+i).value,reps=document.getElementById('r-'+i).value,done=document.getElementById('c-'+i).checked;return {id:e.id,name:e.name,sets:Array.from({length:e.sets},()=>({weight,reps,done}))}});if(!items.some(e=>e.sets.some(s=>s.done))&&!confirm('Nenhum exercício foi marcado. Salvar a sessão mesmo assim?'))return;db.sessions.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),date,program:id,title:p.label,items,notes:document.getElementById('notes').value});if(persist()){toast('Treino salvo!');active=null;tab='historico';render()}}
function saveVolley(){db.sessions.push({id:Date.now().toString(36),date:localDate(),program:'volley-training',title:'Vôlei de areia · 1h30',items:[],notes:'Treino técnico na quadra'});persist();toast('Treino de vôlei registrado!');render()}
function sessionDetails(s){return `<details><summary>Ver séries e observações</summary>${s.items.map(e=>`<div class="listline"><strong class="small">${safe(e.name)}</strong><div class="small muted">${e.sets.filter(a=>a.done).map(a=>(a.weight?`${safe(a.weight)} kg · `:'')+(a.reps?safe(a.reps):'série feita')).join(' | ')||'Sem séries marcadas'}</div></div>`).join('')}${s.notes?`<p class="small">${safe(s.notes)}</p>`:''}</details>`}
function renderHistory(){const ss=[...db.sessions].sort((a,b)=>b.date.localeCompare(a.date));const loads={};for(const s of [...ss].reverse())for(const e of s.items)for(const a of e.sets)if(a.done&&a.weight!==''&&Number.isFinite(Number(a.weight)))loads[e.id]={name:e.name,weight:Number(a.weight),date:s.date};return head('Histórico','Cargas, séries e sessões anteriores')+`<div class="grid"><div class="metric"><strong>${ss.length}</strong><span>Sessões registradas</span></div><div class="metric"><strong>${Object.keys(loads).length}</strong><span>Exercícios com carga</span></div></div><div class="h2">Últimas cargas registradas</div><div class="panel">${Object.keys(loads).length?Object.values(loads).map(e=>`<div class="row spread listline"><span class="small">${safe(e.name)}</span><strong>${e.weight} kg</strong></div>`).join(''):'<div class="empty">Registre cargas nos treinos para vê-las aqui.</div>'}</div><div class="h2">Sessões anteriores</div>${ss.length?ss.map(s=>`<div class="panel"><div class="row spread"><strong>${safe(s.title)}</strong><span class="small muted">${dateStr(s.date)}</span></div>${sessionDetails(s)}<div style="text-align:right;margin-top:10px"><button class="btn ghost small" onclick="deleteSession('${s.id}')">Excluir</button></div></div>`).join(''):'<div class="panel empty">Ainda não há treinos registrados.</div>'}`}
function deleteSession(id){if(!confirm('Excluir esta sessão do histórico?'))return;db.sessions=db.sessions.filter(s=>s.id!==id);persist();render()}
function renderJumps(){const js=[...db.jumps].sort((a,b)=>a.date.localeCompare(b.date));const latest=js.at(-1),best=js.length?Math.max(...js.map(j=>j.cm)):null;const last=js.slice(-8);const mx=Math.max(10,...last.map(j=>j.cm));return head('Evolução da impulsão','Acompanhe seu salto vertical em centímetros')+`<div class="grid"><div class="metric"><strong>${latest?latest.cm+' cm':'—'}</strong><span>Última medição</span></div><div class="metric"><strong>${best!==null?best+' cm':'—'}</strong><span>Melhor marca</span></div></div><div class="panel"><div class="h2" style="margin-top:0">Registrar medição</div><p class="hint">Use sempre o mesmo método (ex.: salto vertical com contramovimento e alcance na parede). Faça 3 tentativas após aquecimento e registre a melhor, em condições semelhantes.</p><div class="grid"><div><label class="small muted">Data</label><input type="date" id="jumpdate" class="input" value="${localDate()}"></div><div><label class="small muted">Altura (cm)</label><input type="number" min="1" max="150" step="0.1" id="jumpcm" class="input" placeholder="Ex.: 42.5"></div></div><label class="small muted" style="display:block;margin-top:10px">Método</label><select class="input" id="jumpmethod"><option>Salto vertical parado (CMJ)</option><option>Salto com aproximação</option><option>Outro método</option></select><button class="btn" style="margin-top:12px;width:100%" onclick="saveJump()">Salvar medição</button></div><div class="h2">Últimas medições</div><div class="panel">${last.length?`<div class="bars">${last.map(j=>`<div class="barcol"><div class="small" style="margin-bottom:4px">${j.cm}</div><div class="bar" style="height:${Math.max(5,j.cm/mx*115)}px"></div><span>${j.date.slice(5)}</span></div>`).join('')}</div><p class="hint">Alturas em centímetros. Compare medições feitas com o mesmo método.</p>`:'<div class="empty">Registre sua primeira medição para acompanhar a evolução.</div>'}${js.slice().reverse().map(j=>`<div class="row spread listline"><span class="small">${dateStr(j.date)} · ${safe(j.method)}</span><span><strong>${j.cm} cm</strong> <button class="btn ghost small" style="padding:5px" onclick="deleteJump('${j.id}')">×</button></span></div>`).join('')}</div>`}
function saveJump(){const cm=Number(document.getElementById('jumpcm').value),date=document.getElementById('jumpdate').value,method=document.getElementById('jumpmethod').value;if(!date||!Number.isFinite(cm)||cm<=0||cm>150){toast('Informe uma altura válida (1–150 cm).');return}db.jumps.push({id:Date.now().toString(36),date,cm,method});persist();toast('Medição salva!');render()}
function deleteJump(id){if(!confirm('Excluir esta medição?'))return;db.jumps=db.jumps.filter(j=>j.id!==id);persist();render()}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),...db},null,2)],{type:'application/json'}));a.download='volley-performance-backup-'+localDate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
function importData(input){const file=input.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(!Array.isArray(obj.sessions)||!Array.isArray(obj.jumps))throw Error('Formato inválido');if(!confirm('Substituir os registros atuais pelos dados do arquivo?'))return;db={sessions:obj.sessions,jumps:obj.jumps};persist();toast('Backup importado!');render()}catch{toast('Arquivo inválido. Use um backup exportado pelo aplicativo.')}};reader.readAsText(file)}
function renderSettings(){return head('Ajustes e backups','Controle dos seus dados')+`<div class="panel"><div class="h2" style="margin-top:0">Seus dados</div><p class="small muted">Os registros ficam neste navegador, neste dispositivo. Para alterar as fichas, atualize o arquivo do site; seus registros existentes permanecem se a origem e o armazenamento do navegador forem mantidos. Abrir o arquivo em outro navegador não transfere o histórico automaticamente. O modo privado, a limpeza dos dados do navegador ou restrições de armazenamento podem apagar registros.</p><div class="row wrap"><button class="btn" onclick="exportData()">↓ Exportar backup</button><label class="btn alt" style="cursor:pointer">↑ Importar backup<input class="hidden" type="file" accept="application/json,.json" onchange="importData(this)"></label></div></div><div class="panel"><div class="h2" style="margin-top:0">Como usar</div><p class="small">1. Abra a ficha em Treinos e registre as séries concluídas.<br>2. Consulte as cargas anteriores em Histórico.<br>3. Exporte um backup regularmente para não perder seus registros.</p></div><div class="panel"><div class="h2" style="margin-top:0">Segurança do treino</div><p class="small muted">Ficha A segunda e sexta, ficha B quarta; vôlei terça e quinta. Atenção: o volume da ficha enviada é alto e pode comprometer a recuperação. Sábado é condicional: se jogar ou estiver cansado, não faça saltos extras. Pare exercícios que provoquem dor, especialmente em joelhos, tendões, ombros ou lombar. Ajuste o plano com profissional presencial se necessário.</p></div><div class="panel"><button class="btn danger" onclick="clearAll()">Apagar todos os registros</button><p class="hint">Ação irreversível sem backup.</p></div>`}
function clearAll(){if(!confirm('Apagar permanentemente todos os registros deste navegador?'))return;db={sessions:[],jumps:[]};persist();toast('Registros apagados.');render()}
function render(){renderTabs();document.getElementById('app').innerHTML=tab==='inicio'?renderHome():tab==='treinos'?renderTreinos():tab==='historico'?renderHistory():renderSettings()}
render();
</script></body></html>
